name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.ref }}
  # A newer push cancels an older run on a PR branch. On main the runs queue instead: a cancelled publish could leave
  # images pushed without their version tag.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  build-and-test:
    # Pinned to the production OS (Ubuntu Server 24.04) instead of ubuntu-latest, which moves to Ubuntu 26.
    # The image ships Docker (Testcontainers: PostgreSQL 17, RabbitMQ 4) and Google Chrome (E2E default browser).
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # Node 22 for the project (package.json engines: >=22.22.2 <23, enforced by .npmrc engine-strict),
      # same as production. The @v5 actions themselves run on Node 24; that does not change this.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Maroik.Website/package-lock.json

      - name: Install client-script toolchain
        working-directory: Maroik.Website
        run: npm ci

      # node_modules is present, so the Website build runs tsc (wwwroot/**/site.js is needed by the E2E suite).
      # Client-script tests run in their own step below, so they are switched off inside the build.
      - name: Build (warnings are errors)
        run: dotnet build Maroik.sln -p:RunClientScriptTests=false

      - name: Client-script tests (Vitest + jsdom)
        working-directory: Maroik.Website
        run: npm test

      # The production images are built by the publish job, which runs only on main, after a merge. Check the Dockerfile
      # tsbuild stage here too, so a PR that breaks it fails before it is merged. Build that stage both ways: a release
      # build (TS_SOURCEMAPS unset, the published image) must minify site.js and ship no source maps; a debug build
      # (TS_SOURCEMAPS=true, docker-compose.debug.yml) must not minify and must ship the maps.
      - name: Docker tsbuild stage (prod = minified, debug = source maps)
        run: |
          set -o pipefail
          docker build --progress=plain --target tsbuild -f Maroik.Website/Dockerfile -t tsbuild-prod . 2>&1 | tee tsbuild-prod.log
          docker build --progress=plain --target tsbuild --build-arg TS_SOURCEMAPS=true -f Maroik.Website/Dockerfile -t tsbuild-debug . 2>&1 | tee tsbuild-debug.log

          grep -qE 'minify: [0-9]+ site\.js minified' tsbuild-prod.log \
            || { echo "::error::prod tsbuild did not minify site.js"; exit 1; }
          ! grep -qE 'minify: [0-9]+ site\.js minified' tsbuild-debug.log \
            || { echo "::error::debug tsbuild minified site.js"; exit 1; }

          maps() { docker run --rm "$1" sh -c "find /ts/wwwroot -path '*/custom/*' -name site.js.map | wc -l"; }
          [ "$(maps tsbuild-prod)" -eq 0 ] || { echo "::error::prod tsbuild shipped source maps"; exit 1; }
          [ "$(maps tsbuild-debug)" -gt 0 ] || { echo "::error::debug tsbuild has no source maps"; exit 1; }
          echo "prod: minified, no maps / debug: not minified, $(maps tsbuild-debug) maps"

      # Every test project except E2E. Run one after another: run side by side, their Testcontainers start and stop
      # on the Docker bridge while E2E's browser is mid-request, which fails it with net::ERR_NETWORK_CHANGED.
      - name: .NET tests with coverage
        run: |
          status=0
          for project in $(ls -d Maroik.*.Tests | grep -vx 'Maroik.E2E.Tests'); do
            echo "::group::$project"
            dotnet test --project "$project" --no-build \
              --coverage --coverage-output-format cobertura \
              --results-directory "${{ github.workspace }}/TestResults" || status=1
            echo "::endgroup::"
          done
          exit $status

      # E2E last and alone, once no other test project's containers are running.
      - name: E2E tests (Playwright) with coverage
        run: >-
          dotnet test --project Maroik.E2E.Tests --no-build
          --coverage --coverage-output-format cobertura
          --results-directory "${{ github.workspace }}/TestResults"

      # Merges the per-project cobertura reports by (file, line), leaves out *.Tests assemblies,
      # prints a per-assembly table and fails below the gate.
      - name: Coverage gate (line >= 80 %, branch >= 65 %)
        run: |
          python3 - "${{ github.workspace }}/TestResults" --line 80 --branch 65 <<'PY'
          import argparse
          import re
          import sys
          import xml.etree.ElementTree as ET
          from collections import defaultdict
          from pathlib import Path

          BRANCH = re.compile(r"\((\d+)/(\d+)\)")


          def is_test_assembly(name: str) -> bool:
              return name.endswith(".Tests")


          def main() -> int:
              parser = argparse.ArgumentParser()
              parser.add_argument("results_dir", type=Path)
              parser.add_argument("--line", type=float, required=True, help="minimum line coverage, percent")
              parser.add_argument("--branch", type=float, required=True, help="minimum branch coverage, percent")
              args = parser.parse_args()

              reports = sorted(args.results_dir.rglob("*.cobertura.xml"))
              if not reports:
                  print(f"::error::No *.cobertura.xml found under {args.results_dir}")
                  return 1

              # (assembly, file, line) -> hit?   and   (assembly, file, line) -> (covered, total) branches
              lines: dict[tuple[str, str, int], bool] = {}
              branches: dict[tuple[str, str, int], tuple[int, int]] = {}

              for report in reports:
                  root = ET.parse(report).getroot()
                  for package in root.iter("package"):
                      assembly = package.get("name", "")
                      if is_test_assembly(assembly):
                          continue
                      for cls in package.iter("class"):
                          filename = cls.get("filename", "")
                          for line in cls.iter("line"):
                              key = (assembly, filename, int(line.get("number", "0")))
                              lines[key] = lines.get(key, False) or int(line.get("hits", "0")) > 0
                              if line.get("branch") == "True":
                                  match = BRANCH.search(line.get("condition-coverage", ""))
                                  if match:
                                      covered, total = int(match.group(1)), int(match.group(2))
                                      old = branches.get(key, (0, total))
                                      branches[key] = (max(old[0], covered), max(old[1], total))

              per_assembly: dict[str, list[int]] = defaultdict(lambda: [0, 0, 0, 0])
              for (assembly, _, _), hit in lines.items():
                  per_assembly[assembly][0] += int(hit)
                  per_assembly[assembly][1] += 1
              for (assembly, _, _), (covered, total) in branches.items():
                  per_assembly[assembly][2] += covered
                  per_assembly[assembly][3] += total

              def pct(part: int, whole: int) -> float:
                  return 100.0 * part / whole if whole else 100.0

              print(f"Merged {len(reports)} report(s)\n")
              print(f"{'Assembly':<40} {'Line':>8} {'Branch':>8}")
              for assembly in sorted(per_assembly):
                  lc, lt, bc, bt = per_assembly[assembly]
                  print(f"{assembly:<40} {pct(lc, lt):>7.1f}% {pct(bc, bt):>7.1f}%")

              line_total = pct(sum(v[0] for v in per_assembly.values()), sum(v[1] for v in per_assembly.values()))
              branch_total = pct(sum(v[2] for v in per_assembly.values()), sum(v[3] for v in per_assembly.values()))
              print(f"{'TOTAL':<40} {line_total:>7.1f}% {branch_total:>7.1f}%")

              failed = False
              if line_total < args.line:
                  print(f"::error::Line coverage {line_total:.1f}% is below {args.line:.0f}%")
                  failed = True
              if branch_total < args.branch:
                  print(f"::error::Branch coverage {branch_total:.1f}% is below {args.branch:.0f}%")
                  failed = True
              return 1 if failed else 0


          if __name__ == "__main__":
              sys.exit(main())
          PY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore
          retention-days: 14

  # Main only, after every test passed: build the three production images once, stamp them with a semver computed from
  # the commit messages, push them to GHCR and tag the commit. The server pulls exactly these images (AutoDeploy.sh)
  # instead of building from source, so what runs in production is what this workflow built and checked.
  publish:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write   # push the version tag
      packages: write   # push the images to ghcr.io
    env:
      IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the whole history and its tags: the version is computed from them

      # Semver from Conventional Commits since the last vX.Y.Z tag, one bump per publish (the largest change wins):
      #   "type!:" or "BREAKING CHANGE:" -> MAJOR, "feat:" -> MINOR, "fix:" -> PATCH, anything else -> unchanged.
      # No tag yet -> this commit becomes v1.0.0. An unchanged version gets no new tag; its images carry the same
      # version with this commit as build metadata (1.4.2+<sha>).
      - name: Compute version
        id: version
        run: |
          last_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          if [ -z "$last_tag" ]; then
            version=1.0.0
          else
            IFS=. read -r major minor patch <<< "${last_tag#v}"
            log=$(git log --format='%s%n%b' "$last_tag..HEAD")
            if grep -qE '^[a-z]+(\([^)]*\))?!:|^BREAKING[ -]CHANGE:' <<< "$log"; then
              major=$((major + 1)); minor=0; patch=0
            elif grep -qE '^feat(\([^)]*\))?:' <<< "$log"; then
              minor=$((minor + 1)); patch=0
            elif grep -qE '^fix(\([^)]*\))?:' <<< "$log"; then
              patch=$((patch + 1))
            fi
            version="$major.$minor.$patch"
          fi
          if [ "v$version" = "$last_tag" ]; then new_tag=false; else new_tag=true; fi
          revision=$(git rev-parse --short=12 HEAD)
          echo "version=$version"   >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "new_tag=$new_tag"   >> "$GITHUB_OUTPUT"
          echo "Version $version+$revision (last tag: ${last_tag:-none}, new tag: $new_tag)"

      - name: Build images
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REVISION: ${{ steps.version.outputs.revision }}
        run: |
          set -o pipefail
          prefix="${IMAGE_PREFIX,,}"
          for app in website filestorage worker; do
            case $app in
              website)     dockerfile=Maroik.Website/Dockerfile ;;
              filestorage) dockerfile=Maroik.FileStorage/Dockerfile ;;
              worker)      dockerfile=Maroik.Worker/Dockerfile ;;
            esac
            echo "::group::maroik-$app"
            docker build --progress=plain -f "$dockerfile" \
              --build-arg APP_VERSION="$VERSION" --build-arg SOURCE_REVISION="$REVISION" \
              --label org.opencontainers.image.source="https://github.com/${{ github.repository }}" \
              --label org.opencontainers.image.version="$VERSION" \
              --label org.opencontainers.image.revision="${{ github.sha }}" \
              -t "$prefix/maroik-$app:sha-$REVISION" . 2>&1 | tee "build-$app.log"
            echo "::endgroup::"
          done

      # The image that ships: its client scripts are minified and carry no source maps.
      - name: Check the website image
        env:
          REVISION: ${{ steps.version.outputs.revision }}
        run: |
          image="${IMAGE_PREFIX,,}/maroik-website:sha-$REVISION"
          grep -qE 'minify: [0-9]+ site\.js minified' build-website.log \
            || { echo "::error::website image: site.js was not minified"; exit 1; }
          maps=$(docker run --rm --entrypoint sh "$image" -c "find /app/wwwroot -path '*/custom/*' -name site.js.map | wc -l")
          [ "$maps" -eq 0 ] || { echo "::error::website image ships $maps source maps"; exit 1; }

      - name: Push images
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REVISION: ${{ steps.version.outputs.revision }}
          NEW_TAG: ${{ steps.version.outputs.new_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          prefix="${IMAGE_PREFIX,,}"
          for app in website filestorage worker; do
            image="$prefix/maroik-$app"
            docker push "$image:sha-$REVISION"
            docker tag "$image:sha-$REVISION" "$image:latest" && docker push "$image:latest"
            if [ "$NEW_TAG" = true ]; then
              docker tag "$image:sha-$REVISION" "$image:$VERSION" && docker push "$image:$VERSION"
            fi
          done

      - name: Tag the release
        if: steps.version.outputs.new_tag == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION" "${{ github.sha }}"
          git push origin "v$VERSION"