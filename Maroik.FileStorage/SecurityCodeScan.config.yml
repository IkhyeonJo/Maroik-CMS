# SecurityCodeScan project configuration, merged with the analyzer's built-in rules.
# Only declares this project's own validators; it switches no rule off.
Version: 3.1

Sanitizers:
  # Returns the requested path only when it resolves inside the storage root (null otherwise),
  # so a value it returns cannot traverse out of the root (SCS0018, path traversal).
  - Type: Maroik.FileStorage.Helpers.StoragePath
    TaintTypes:
      - SCS0018
    Methods:
      - Name: ResolveWithinRoot
